<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신수학 연결 확인</title>
<style>body{font-family:sans-serif;padding:24px;background:#F5EDDD;color:#222}h1{color:#8A6A3C;font-size:20px}code{display:block;word-break:break-all;background:#fff;padding:16px;border-radius:8px;font-size:15px;margin:12px 0}button{font-size:16px;padding:12px 18px;background:#8A6A3C;color:#fff;border:0;border-radius:8px}</style>
<h1>연결이 끝났습니다</h1><p>아래 <b>이 페이지의 주소 전체</b>를 복사해서 클로드 창에 붙여넣어 주세요.</p>
<code id="u"></code><button onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='복사됐습니다 ✓')">주소 복사</button>
